name: Android release

# Builds the signed release AAB (for Google Play) and APK (for local testing) from any branch, tag or commit,
# then tags that commit android/v<version>. With no version given it bumps the minor version of the latest
# android/v* tag; the version code is major * 10000 + minor * 100 + patch. Builds outside this workflow are
# 0.0.0-dev. Signing uses the same injected properties as Android Studio's "Generate Signed Bundle / APK".
# Secrets live in the android-release environment:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   WYKOP_KEY, WYKOP_SECRET, GOOGLE_SERVICES_RELEASE_JSON_BASE64

run-name: Android release ${{ inputs.version || '(next minor)' }} from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to build
        required: true
        default: main
        type: string
      version:
        description: Version, e.g. 2.7.0 (empty bumps the minor version of the latest release)
        required: false
        type: string

# Two runs at once could pick the same version.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    env:
      BUILD_TOOLS_VERSION: 37.0.0

    steps:
      - name: Check release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WYKOP_KEY: ${{ secrets.WYKOP_KEY }}
          WYKOP_SECRET: ${{ secrets.WYKOP_SECRET }}
          GOOGLE_SERVICES_RELEASE_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            WYKOP_KEY WYKOP_SECRET GOOGLE_SERVICES_RELEASE_JSON_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the android-release environment: ${missing[*]}"
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          released=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/android/v" --jq '.[].ref' \
            | sed 's|^refs/tags/android/v||' | { grep -E "$semver" || true; } | sort -V)
          latest=$(tail -n 1 <<< "$released")

          version="${REQUESTED//[[:space:]]/}"
          if [ -z "$version" ]; then
            if [ -z "$latest" ]; then
              echo "::error::There is no android/v* tag to bump yet. Enter the version of the first release."
              exit 1
            fi
            IFS=. read -r major minor _ <<< "$latest"
            version="$major.$((minor + 1)).0"
          fi

          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a version like 2.7.0"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::Minor and patch must stay below 100 to fit the version code"
            exit 1
          fi
          if grep -qxF "$version" <<< "$released"; then
            echo "::error::android/v$version already exists"
            exit 1
          fi
          # Google Play only accepts a version code higher than the ones it already has.
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            echo "::error::$version must be higher than the latest release, $latest"
            exit 1
          fi

          {
            echo "name=$version"
            echo "code=$((major * 10000 + minor * 100 + patch))"
            echo "tag=android/v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check out sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Read-only: caches of a public repo are readable by fork PRs, and this build holds real keys.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})" >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION"

      - name: Write release config and keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WYKOP_KEY: ${{ secrets.WYKOP_KEY }}
          WYKOP_SECRET: ${{ secrets.WYKOP_SECRET }}
          GOOGLE_SERVICES_RELEASE_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf 'WYKOP_KEY=%s\nWYKOP_SECRET=%s\n' "$WYKOP_KEY" "$WYKOP_SECRET" > apikeys.properties
          mkdir -p androidApp/src/release
          base64 --decode <<< "$GOOGLE_SERVICES_RELEASE_JSON_BASE64" > androidApp/src/release/google-services.json
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew --stacktrace :androidApp:bundleRelease :androidApp:assembleRelease \
            -Ppodkop.versionName="$VERSION_NAME" \
            -Ppodkop.versionCode="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify signing and name outputs
        id: release
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REF: ${{ inputs.ref }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab

          sha256_of() { awk '$1 == "SHA256:" { gsub(":", "", $2); print tolower($2); exit }'; }
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256_of)
          apk_cert=$("$build_tools/apksigner" verify --print-certs "$apk" \
            | awk -F 'certificate SHA-256 digest: ' 'NF > 1 { print $2; exit }')
          aab_cert=$(keytool -printcert -jarfile "$aab" | sha256_of)
          if [ -z "$expected" ] || [ "$apk_cert" != "$expected" ] || [ "$aab_cert" != "$expected" ]; then
            echo "::error::Release outputs are not signed with the upload key (expected '$expected', APK '$apk_cert', AAB '$aab_cert')"
            exit 1
          fi

          version=$("$build_tools/aapt2" dump badging "$apk" \
            | sed -n "s/^package: .* versionCode='\([^']*\)' versionName='\([^']*\)'.*/\2-\1/p")
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from $apk"
            exit 1
          fi
          if [ "$version" != "$VERSION_NAME-$VERSION_CODE" ]; then
            echo "::error::The APK is $version instead of $VERSION_NAME-$VERSION_CODE; $REF predates versioning from this workflow"
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          commit=$(git rev-parse --short HEAD)
          name="podkop-$version-$commit"
          mkdir -p "$RUNNER_TEMP/apk" "$RUNNER_TEMP/aab"
          cp "$apk" "$RUNNER_TEMP/apk/$name.apk"
          cp "$aab" "$RUNNER_TEMP/aab/$name.aab"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          {
            echo "## Android release"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${version%-*}\` (code \`${version##*-}\`) |"
            echo "| Ref | \`$REF\` at \`$commit\` |"
            echo "| Tag | \`android/v$VERSION_NAME\` |"
            echo "| Upload key SHA-256 | \`$expected\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.name }}-apk
          path: ${{ runner.temp }}/apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.name }}-aab
          path: ${{ runner.temp }}/aab
          if-no-files-found: error

      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-build-reports
          path: |
            androidApp/build/reports
            build/reports/problems
          if-no-files-found: ignore

  # A separate job, so the Gradle build never holds a token that can write to the repo.
  tag-release:
    name: Tag the released commit
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-release.outputs.tag }}
          COMMIT: ${{ needs.build-release.outputs.commit }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" > /dev/null
          echo "Tagged \`$COMMIT\` as \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
