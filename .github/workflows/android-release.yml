name: Android release

# Builds the signed release AAB (for Google Play) and APK (for local testing) from any branch, tag or commit.
# Signing uses the same injected properties as Android Studio's "Generate Signed Bundle / APK", so refs that
# predate this workflow build the same way. Secrets live in the android-release environment:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#   WYKOP_KEY, WYKOP_SECRET, GOOGLE_SERVICES_RELEASE_JSON_BASE64

run-name: Android release from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release

    env:
      BUILD_TOOLS_VERSION: 37.0.0

    steps:
      - name: Check release secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WYKOP_KEY: ${{ secrets.WYKOP_KEY }}
          WYKOP_SECRET: ${{ secrets.WYKOP_SECRET }}
          GOOGLE_SERVICES_RELEASE_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            WYKOP_KEY WYKOP_SECRET GOOGLE_SERVICES_RELEASE_JSON_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets in the android-release environment: ${missing[*]}"
            exit 1
          fi

      - name: Check out sources
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Read-only: caches of a public repo are readable by fork PRs, and this build holds real keys.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})" >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION"

      - name: Write release config and keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WYKOP_KEY: ${{ secrets.WYKOP_KEY }}
          WYKOP_SECRET: ${{ secrets.WYKOP_SECRET }}
          GOOGLE_SERVICES_RELEASE_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_RELEASE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf 'WYKOP_KEY=%s\nWYKOP_SECRET=%s\n' "$WYKOP_KEY" "$WYKOP_SECRET" > apikeys.properties
          mkdir -p androidApp/src/release
          base64 --decode <<< "$GOOGLE_SERVICES_RELEASE_JSON_BASE64" > androidApp/src/release/google-services.json
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace :androidApp:bundleRelease :androidApp:assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify signing and name outputs
        id: release
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          apk=androidApp/build/outputs/apk/release/androidApp-release.apk
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab

          sha256_of() { awk '$1 == "SHA256:" { gsub(":", "", $2); print tolower($2); exit }'; }
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256_of)
          apk_cert=$("$build_tools/apksigner" verify --print-certs "$apk" \
            | awk -F 'certificate SHA-256 digest: ' 'NF > 1 { print $2; exit }')
          aab_cert=$(keytool -printcert -jarfile "$aab" | sha256_of)
          if [ -z "$expected" ] || [ "$apk_cert" != "$expected" ] || [ "$aab_cert" != "$expected" ]; then
            echo "::error::Release outputs are not signed with the upload key (expected '$expected', APK '$apk_cert', AAB '$aab_cert')"
            exit 1
          fi

          version=$("$build_tools/aapt2" dump badging "$apk" \
            | sed -n "s/^package: .* versionCode='\([^']*\)' versionName='\([^']*\)'.*/\2-\1/p")
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from $apk"
            exit 1
          fi
          commit=$(git rev-parse --short HEAD)
          name="podkop-$version-$commit"
          mkdir -p "$RUNNER_TEMP/apk" "$RUNNER_TEMP/aab"
          cp "$apk" "$RUNNER_TEMP/apk/$name.apk"
          cp "$aab" "$RUNNER_TEMP/aab/$name.aab"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          {
            echo "## Android release"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${version%-*}\` (code \`${version##*-}\`) |"
            echo "| Ref | \`$REF\` at \`$commit\` |"
            echo "| Upload key SHA-256 | \`$expected\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.name }}-apk
          path: ${{ runner.temp }}/apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.name }}-aab
          path: ${{ runner.temp }}/aab
          if-no-files-found: error

      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-build-reports
          path: |
            androidApp/build/reports
            build/reports/problems
          if-no-files-found: ignore
