name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-android:
    name: Verify Android build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})" >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Create CI-only Android config
        shell: bash
        run: |
          cat <<'EOF' > apikeys.properties
          WYKOP_KEY=ci-placeholder-key
          WYKOP_SECRET=ci-placeholder-secret
          EOF

          mkdir -p androidApp/src/debug androidApp/src/release

          cat <<'EOF' > androidApp/src/debug/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "podkop-ci-debug",
              "storage_bucket": "podkop-ci-debug.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:debugplaceholder",
                  "android_client_info": {
                    "package_name": "pl.masslany.podkop.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci-debug-placeholder-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          cat <<'EOF' > androidApp/src/release/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "podkop-ci-release",
              "storage_bucket": "podkop-ci-release.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:releaseplaceholder",
                  "android_client_info": {
                    "package_name": "pl.masslany.podkop"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "ci-release-placeholder-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Verify Android app assembles
        run: ./gradlew --stacktrace :androidApp:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: androidApp-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: |
            androidApp/build/reports
            build/reports/problems
          if-no-files-found: ignore

  verify-kmp:
    name: Verify KMP shared modules
    runs-on: macos-26
    timeout-minutes: 45

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Verify pinned Apple Silicon toolchain
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})" >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Create CI-only API keys
        shell: bash
        run: |
          cat <<'EOF' > apikeys.properties
          WYKOP_KEY=ci-placeholder-key
          WYKOP_SECRET=ci-placeholder-secret
          EOF

      - name: Create CI-only iOS config
        shell: bash
        run: |
          mkdir -p iosApp/Configuration

          cat <<'EOF' > iosApp/Configuration/ApiKeys.xcconfig
          WYKOP_KEY=ci-placeholder-key
          WYKOP_SECRET=ci-placeholder-secret
          EOF

      - name: Verify KMP shared modules
        run: ./gradlew --stacktrace :common:allTests :business:allTests :composeApp:allTests :iosShared:iosSimulatorArm64Test

      - name: Upload KMP failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kmp-test-reports
          path: |
            common/build/reports
            business/build/reports
            composeApp/build/reports
            iosShared/build/reports
            build/reports/problems
          if-no-files-found: ignore

  verify-ios:
    name: Build and test iOS
    runs-on: macos-26
    timeout-minutes: 60

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Verify pinned Apple Silicon toolchain
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK for Gradle configuration
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})" >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Create CI-only API keys
        shell: bash
        run: |
          cat <<'EOF' > apikeys.properties
          WYKOP_KEY=ci-placeholder-key
          WYKOP_SECRET=ci-placeholder-secret
          EOF
          cat <<'EOF' > iosApp/Configuration/ApiKeys.xcconfig
          WYKOP_KEY=ci-placeholder-key
          WYKOP_SECRET=ci-placeholder-secret
          EOF

      - name: Record toolchain and select an iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcodebuild -version
          java -version
          ./gradlew --version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-simulators.json"
          python3 - "$RUNNER_TEMP/ios-simulators.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          devices = json.load(open(sys.argv[1], encoding="utf-8"))["devices"]
          import re
          import subprocess

          sdk = tuple(map(int, subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip().split(".")))
          def version(runtime):
              return tuple(map(int, re.search(r"iOS-(\d+(?:-\d+)*)$", runtime).group(1).split("-")))
          phones = [(runtime, device) for runtime, entries in devices.items()
                    if re.search(r"iOS-(\d+(?:-\d+)*)$", runtime) and version(runtime) <= sdk
                    for device in entries if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          runtime, device = max(phones, key=lambda item: (version(item[0]), item[1]["name"]))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"id={device['udid']}\n")
          print(f"Selected {device['name']} ({runtime})")
          PY

      - name: Compile the device framework
        run: ./gradlew --stacktrace :iosShared:linkDebugFrameworkIosArm64

      - name: Build Simulator and device targets
        shell: bash
        run: |
          for configuration in Debug Release; do
            xcodebuild -project iosApp/iosApp.xcodeproj -scheme Podkop \
              -configuration "$configuration" -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/podkop-ios-derived" \
              CODE_SIGNING_ALLOWED=NO build
          done
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme Podkop \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/podkop-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Verify built iOS bundle metadata
        run: |
          python3 scripts/ci/verify_ios_bundle.py \
            "$RUNNER_TEMP/podkop-ios-derived/Build/Products/Debug-iphonesimulator/Podkop.app" --configuration Debug
          python3 scripts/ci/verify_ios_bundle.py \
            "$RUNNER_TEMP/podkop-ios-derived/Build/Products/Release-iphonesimulator/Podkop.app" --configuration Release
          python3 scripts/ci/verify_ios_bundle.py \
            "$RUNNER_TEMP/podkop-ios-derived/Build/Products/Release-iphoneos/Podkop.app" --configuration Release

      - name: Run iOS unit tests
        id: unit_tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme Podkop \
            -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/podkop-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/podkop-ios-unit-tests.xcresult" \
            -only-testing:PodkopTests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 30 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test \
            2>&1 | tee "$RUNNER_TEMP/podkop-ios-unit-tests.log"
          grep -Fq 'PodkopTests.xctest' "$RUNNER_TEMP/podkop-ios-unit-tests.log"
          grep -Eq 'Executed [1-9][0-9]* tests' "$RUNNER_TEMP/podkop-ios-unit-tests.log"
          grep -Fq '** TEST SUCCEEDED **' "$RUNNER_TEMP/podkop-ios-unit-tests.log"

      - name: Run iOS fixture UI tests
        if: ${{ !cancelled() && steps.unit_tests.outcome != 'skipped' }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme Podkop \
            -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/podkop-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/podkop-ios-ui-tests.xcresult" \
            -only-testing:PodkopUITests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test \
            2>&1 | tee "$RUNNER_TEMP/podkop-ios-ui-tests.log"
          grep -Fq 'PodkopUITests.xctest' "$RUNNER_TEMP/podkop-ios-ui-tests.log"
          grep -Eq 'Executed [1-9][0-9]* tests' "$RUNNER_TEMP/podkop-ios-ui-tests.log"
          grep -Fq '** TEST SUCCEEDED **' "$RUNNER_TEMP/podkop-ios-ui-tests.log"

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/podkop-ios-unit-tests.xcresult
            ${{ runner.temp }}/podkop-ios-unit-tests.log
            ${{ runner.temp }}/podkop-ios-ui-tests.xcresult
            ${{ runner.temp }}/podkop-ios-ui-tests.log
          if-no-files-found: ignore

  coverage:
    name: Coverage summary
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})" >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Create CI-only API keys
        shell: bash
        run: |
          cat <<'EOF' > apikeys.properties
          WYKOP_KEY=ci-placeholder-key
          WYKOP_SECRET=ci-placeholder-secret
          EOF

      - name: Generate JVM coverage reports
        run: ./gradlew --stacktrace koverXmlReport koverHtmlReport

      - name: Publish coverage summary
        shell: bash
        run: |
          coverage_from_xml() {
            local report_path="$1"
            local values
            values=$(grep '<counter type="LINE"' "$report_path" | tail -n 1 | sed -E 's/.*missed="([0-9]+)".*covered="([0-9]+)".*/\1 \2/')
            local missed covered total
            read -r missed covered <<< "$values"
            total=$((missed + covered))

            if [ "$total" -eq 0 ]; then
              printf "0.00"
            else
              awk -v covered="$covered" -v total="$total" 'BEGIN { printf "%.2f", (covered * 100) / total }'
            fi
          }

          total_coverage=$(coverage_from_xml build/reports/kover/report.xml)
          common_coverage=$(coverage_from_xml common/build/reports/kover/report.xml)
          business_coverage=$(coverage_from_xml business/build/reports/kover/report.xml)
          compose_app_coverage=$(coverage_from_xml composeApp/build/reports/kover/report.xml)

          {
            echo "## Coverage Summary"
            echo
            echo "JVM coverage is measured with Kover from Android host/JVM tests only."
            echo
            echo "| Scope | Line Coverage |"
            echo "| --- | ---: |"
            echo "| Total | ${total_coverage}% |"
            echo "| common | ${common_coverage}% |"
            echo "| business | ${business_coverage}% |"
            echo "| composeApp | ${compose_app_coverage}% |"
            echo
            echo "HTML and XML coverage reports are available in the \`coverage-reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            build/reports/kover
            common/build/reports/kover
            business/build/reports/kover
            composeApp/build/reports/kover
          if-no-files-found: error
